name: Test and publish images

on:
  push:
    tags:
      - "v*" # Triggers only on version tags like v1.2.3
  workflow_dispatch: # Manual trigger
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

env:
  GAMESERVER_IMAGE: bevdev1/onlyone-gameserver:${{ github.ref_name }}
  NGINX_IMAGE: bevdev1/onlyone-nginx:${{ github.ref_name }}

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Install dependencies
        run: npm ci
        working-directory: front
      - name: Install gameserver dependencies (needed by e2e tests)
        run: npm ci
        working-directory: gameserver
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: front
      - name: Run unit tests
        run: npm run test:unit
        working-directory: front
      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: front

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Install dependencies
        run: npm ci
        working-directory: gameserver
      - name: Run unit tests
        run: npm run test
        working-directory: gameserver

  build-frontend-nginx:
    needs: [test-frontend, test-server] # Wait for tests to pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build combined nginx+frontend image
      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}

  build-gameserver:
    needs: [test-frontend, test-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gameserver image
        uses: docker/build-push-action@v5
        with:
          context: ./gameserver
          file: ./gameserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GAMESERVER_IMAGE }}
